<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12553e"><title>Spider – Siskon parempi pasianssi</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;background:radial-gradient(ellipse at center,#247454,#092d22);font:15px system-ui,sans-serif;overscroll-behavior:none}header{padding:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,select{font:inherit;padding:8px 12px;border:0;border-radius:9px;background:#f0e5cd;color:#173c2d;cursor:pointer}button:disabled{opacity:.4}select{background:#f0e5cd;color:#173c2d;border:0;border-radius:9px;padding:8px 6px}main{max-width:1200px;margin:auto;padding:12px 5px;--cw:min(9.1vw,91px);--ch:calc(var(--cw)*1.42)}#board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0} .column{position:relative;min-height:calc(var(--ch)*4.8);width:var(--cw);border:1px solid #ffffff28;border-radius:7px}.card{position:absolute;left:0;width:var(--cw);height:var(--ch);background:white center/100% 100% no-repeat;border:1px solid #aaa;border-radius:6px;box-shadow:0 2px 4px #0005;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.back{background:#153d87 url('./card-back.svg') center/100% 100% no-repeat;border-color:#ddd}.selected{outline:3px solid #ffd65b}.foot{display:flex;align-items:center;gap:15px;padding:10px;flex-wrap:wrap}.stock{display:flex;gap:3px;min-height:calc(var(--ch)*.55);align-items:center}.stock button{padding:5px 10px}.mini{width:22px;height:30px;background:#153d87 url('./card-back.svg') center/cover;border:1px solid white;border-radius:3px}.hint{font-size:13px;opacity:.85;padding:8px}dialog{background:#f7eed9;color:#153d2d;border:2px solid #c5a967;border-radius:15px;padding:22px}dialog::backdrop{background:#001b12bb}@media(max-width:650px){header{gap:5px;padding:6px}h1{font-size:16px}button{font-size:12px;padding:6px 8px}main{padding:7px 3px}.column{min-height:calc(var(--ch)*6)}} 
</style></head><body><header><h1>♠ Spider</h1><button onclick="location.href='./index.html'">Pelivalikko</button><select id="difficulty" aria-label="Vaikeustaso"><option value="1">1 maa</option><option value="2">2 maata</option><option value="4">4 maata</option></select><button id="new">Uusi peli</button><button id="undo">Peru</button><button id="sound">🔊</button><small>v0.9.2</small></header><main><div id="board"></div><div class="foot"><div class="stock" id="stock"></div><span id="status"></span></div><p class="hint">Siirrä kortteja vetämällä tai valitse ensin kortti ja sitten kohdesarake. Kaksoisnapautus siirtää mahdolliseen paikkaan. Kokonainen K–A-sarja poistuu automaattisesti.</p></main><dialog id="confirm"><h2>Uusi Spider-peli?</h2><p>Nykyinen peli päättyy.</p><button id="cancel">Jatka</button> <button id="start">Aloita uusi</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let difficulty=1,columns=[],stock=[],removed=0,history=[],selected=null,drag=null,lastTap=null,sound=true,audio=null,won=false;
function tone(f=450){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}catch{}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){let deck=shuffle(Array.from({length:104},(_,i)=>({n:i%13+1,s:Math.floor(i/13)%difficulty,up:false,id:i})));columns=Array.from({length:10},()=>[]);for(let i=0;i<54;i++){let c=deck.pop(),col=i%10;c.up=i>=44;columns[col].push(c)}stock=deck;removed=0;history=[];selected=null;lastTap=null;won=false;render()}
function snapshot(){history.push(JSON.stringify({columns,stock,removed,won}));if(history.length>150)history.shift()}
function run(i,j){let p=columns[i];if(!p||!p[j]?.up)return false;for(let k=j;k<p.length-1;k++)if(!p[k+1].up||(p[k].n!==p[k+1].n+1||p[k].s!==p[k+1].s))return false;return true}
function legal(i,j,to){if(i===to||!run(i,j))return false;let dest=columns[to],c=columns[i][j];return !dest.length||dest.at(-1).n===c.n+1}
function complete(){let count=0;for(let p of columns){while(p.length>=13){let a=p.slice(-13);if(a[0].n!==13||!a.every((c,i)=>c.up&&c.n===13-i&&c.s===a[0].s))break;p.splice(-13);removed++;count++;if(p.length)p.at(-1).up=true}}return count}
function move(i,j,to){if(!legal(i,j,to))return false;snapshot();let src=columns[i];columns[to].push(...src.splice(j));if(src.length)src.at(-1).up=true;let n=complete();selected=null;render();tone(n?700:480);return true}
function autoMove(i,j){for(let to=0;to<10;to++)if(columns[to].length&&legal(i,j,to))return move(i,j,to);for(let to=0;to<10;to++)if(!columns[to].length&&legal(i,j,to))return move(i,j,to);return false}
function deal(){if(!stock.length)return;if(columns.some(p=>!p.length)){$('status').textContent='Täytä tyhjät sarakkeet ennen jakoa.';return}snapshot();for(let p of columns){let c=stock.pop();c.up=true;p.push(c)}let n=complete();selected=null;render();tone(n?700:330)}
function card(c,i,j,step){let el=document.createElement('div');el.className='card'+(c.up?'':' back')+(selected?.i===i&&j>=selected.j?' selected':'');el.style.top=j*step+'px';el.style.zIndex=j+1;if(c.up){let r=c.n===1?'A':c.n===10?'0':c.n===11?'J':c.n===12?'Q':c.n===13?'K':String(c.n);el.style.backgroundImage="url('https://deckofcardsapi.com/static/img/"+r+["S","H","C","D"][c.s]+".png')";el.setAttribute('aria-label',r+['♠','♥','♣','♦'][c.s])}el.addEventListener('pointerdown',e=>{if(!run(i,j))return;e.preventDefault();el.setPointerCapture(e.pointerId);drag={i,j,x:e.clientX,y:e.clientY,moved:false,el}});return el}
function render(){let b=$('board');b.replaceChildren();let step=Math.max(15,Math.min(28,innerHeight*.029));columns.forEach((p,i)=>{let col=document.createElement('div');col.className='column';col.dataset.col=i;col.style.height=Math.max(innerHeight*.55,p.length*step+parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ch'))||p.length*step+110)+'px';p.forEach((c,j)=>col.append(card(c,i,j,step)));col.addEventListener('click',e=>{if(e.target!==col)return;if(selected)move(selected.i,selected.j,i)});b.append(col)});$('stock').replaceChildren();let btn=document.createElement('button');btn.textContent='Jaa 10 korttia';btn.disabled=!stock.length;btn.onclick=deal;$('stock').append(btn);for(let i=0;i<stock.length/10;i++){let e=document.createElement('span');e.className='mini';$('stock').append(e)}$('status').textContent='Valmiit sarjat: '+removed+'/8 · Jakoja jäljellä: '+stock.length/10;$('undo').disabled=!history.length;if(removed===8&&!won){won=true;setTimeout(()=>{alert('Voitit Spiderin! 🎉')},100)}}
window.addEventListener('pointermove',e=>{if(!drag)return;let d=drag,dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.moved&&Math.hypot(dx,dy)>8){d.moved=true;let rect=d.el.getBoundingClientRect();let ghost=document.createElement('div');ghost.style.cssText='position:fixed;pointer-events:none;z-index:10000;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px';let step=Math.max(15,Math.min(28,innerHeight*.029));columns[d.i].slice(d.j).forEach((c,k)=>{let x=card(c,d.i,d.j+k,step);x.style.width=rect.width+'px';x.style.height=rect.height+'px';ghost.append(x)});document.body.append(ghost);d.ghost=ghost;d.hidden=Array.from(d.el.parentElement.children).slice(d.j);d.hidden.forEach(x=>x.style.visibility='hidden')}if(d.moved)d.ghost.style.transform='translate('+dx+'px,'+dy+'px)'});
window.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.ghost)d.ghost.remove();d.hidden?.forEach(x=>x.style.visibility='');if(d.moved){lastTap=null;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.column');if(el&&move(d.i,d.j,+el.dataset.col))return;selected=null;render()}else{let now=Date.now(),double=lastTap&&lastTap.i===d.i&&lastTap.j===d.j&&now-lastTap.time<420;lastTap=double?null:{i:d.i,j:d.j,time:now};if(double){selected=null;if(autoMove(d.i,d.j))return}if(selected&&move(selected.i,selected.j,d.i))return;if(selected?.i===d.i&&selected?.j===d.j)selected=null;else selected={i:d.i,j:d.j};render()}});
window.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag?.hidden?.forEach(x=>x.style.visibility='');drag=null;render()});
$('new').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>$('confirm').close();$('start').onclick=()=>{$('confirm').close();fresh()};$('undo').onclick=()=>{if(!history.length)return;({columns,stock,removed,won}=JSON.parse(history.pop()));selected=null;render()};$('difficulty').onchange=e=>{difficulty=Number(e.target.value);fresh()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};document.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});document.addEventListener('dragstart',e=>e.preventDefault());fresh();
</script></body></html>
